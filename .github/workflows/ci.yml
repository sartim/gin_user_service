name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: user_service_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d user_service_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INTEGRATION_DB_URL: postgres://postgres:postgres@localhost:5432/user_service_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          # Disable setup-go cache until GitHub's cache archive restore issue is resolved.
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -o build/user-service ./cmd
      - name: Scan Go dependencies
        run: |
          GOBIN="${RUNNER_TEMP}/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "${RUNNER_TEMP}/bin/govulncheck" ./...
      - name: Build container
        run: docker build --tag gin-user-service:${GITHUB_SHA} .
      - name: Validate migration filenames
        run: |
          versions=$(for migration in internal/migrations/sql/*.up.sql; do basename "$migration"; done | sed -E 's/^([0-9]+)_.*/\1/' | sort -n)
          test -n "$versions"
          test "$(printf '%s\n' "$versions" | uniq -d)" = ""
          for migration in internal/migrations/sql/*.up.sql; do
            test -f "${migration%.up.sql}.down.sql"
          done
