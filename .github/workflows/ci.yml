name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -o build/user-service ./cmd
      - name: Scan Go dependencies
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
      - name: Build container
        run: docker build --tag gin-user-service:${GITHUB_SHA} .
      - name: Validate migration filenames
        run: |
          versions=$(find internal/migrations/sql -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort -n)
          test -n "$versions"
          test "$(printf '%s\n' "$versions" | uniq -d)" = ""
          for migration in internal/migrations/sql/*.up.sql; do
            test -f "${migration%.up.sql}.down.sql"
          done
