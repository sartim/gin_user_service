name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Validate semantic-version tag
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Verify source
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o user-service ./cmd
      - name: Build release archive
        run: tar -czf "gin-user-service-${GITHUB_REF_NAME}.tar.gz" user-service README.md CHANGELOG.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: gin-user-service-${{ github.ref_name }}.tar.gz
