name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: false
      - name: Verify source
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o user-service ./cmd
      - name: Install semantic-release
        run: |
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/go-semantic-release/semantic-release/v2/cmd/semantic-release@v2.31.0
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Run semantic-release
        run: semantic-release --allow-no-changes --hooks goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
